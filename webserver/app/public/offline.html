<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hors connexion — TheGoodCorner</title>
  <style>
    :root {
      --color-bg: #ffffff;
      --color-text: #111827;
      --color-text-muted: #6b7280;
      --color-primary: #2563eb;
      --color-primary-hover: #1d4ed8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #0b0f19;
        --color-text: #f3f4f6;
        --color-text-muted: #9ca3af;
        --color-primary: #3b82f6;
        --color-primary-hover: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 380px; }
    .emoji { font-size: 44px; margin-bottom: 16px; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { color: var(--color-text-muted); margin: 0 0 24px; line-height: 1.5; font-size: 0.95rem; }
    button {
      background: var(--color-primary);
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    button:hover { background: var(--color-primary-hover); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="emoji">🛍️</div>
    <h1>Pas de connexion</h1>
    <p>
      TheGoodCorner a besoin d'internet pour afficher cette page.
      Vérifiez votre connexion puis réessayez.
    </p>
    <button onclick="window.location.reload()">Réessayer</button>
  </div>
</body>
</html>
