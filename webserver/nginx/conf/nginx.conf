events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript;
    gzip_min_length 1000;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=chat:10m rate=50r/s;

    upstream back { 
        server back:3000;
        keepalive 32;
    }
    server {
        listen 80;
        server_name localhost;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        root /usr/share/nginx/html/app;
        index index.html;
        client_max_body_size 10M;

        # 1. Uploads
        location ^~ /uploads/ {
            limit_except GET HEAD {
                deny all;
            }
            proxy_pass http://back;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ignore_headers Cache-Control;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            expires -1;
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # manifest pour serviceWorker
        location = /manifest.json {
            add_header Content-Type application/manifest+json;
        }

        location /service-worker.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
        }

        # 2. Swagger UI (HTTP only)
        location ^~ /api-docs {
            proxy_pass http://back;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. API endpoints
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            limit_req_status 429;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://back;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 300s;
            proxy_pass_header Set-Cookie;
        }

        # 5. WebSockets
        location /socket.io/ {
            limit_req zone=chat burst=100 nodelay;
            limit_req_status 429;
            proxy_pass http://back;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 1d;
            proxy_read_timeout 1d;
            proxy_buffering off;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # 6. Frontend static assets & fallback
        location / {
            try_files $uri $uri/ @index;
        }

        location @index {
            rewrite ^(.*)$ /index.html break;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # HSTS désactivé en dev local pour éviter le forçage HTTPS
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        root /usr/share/nginx/html/app;
        index index.html;
        client_max_body_size 10M;

        # Swagger UI bloqué sur HTTPS
        location = /api-docs {
            return 404;
        }
        location ^~ /api-docs/ {
            return 404;
        }

        # 1. Uploads
        location ^~ /uploads/ {
            limit_except GET HEAD {
                deny all;
            }
            proxy_pass http://back;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ignore_headers Cache-Control;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            expires -1;
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # manifest pour serviceWorker
        location = /manifest.json {
            add_header Content-Type application/manifest+json;
        }

        location /service-worker.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
        }

        # 3. API endpoints
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            limit_req_status 429;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://back;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 300s;
            proxy_pass_header Set-Cookie;
        }

        # 4. WebSockets
        location /socket.io/ {
            limit_req zone=chat burst=100 nodelay;
            limit_req_status 429;
            proxy_pass http://back;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 1d;
            proxy_read_timeout 1d;
            proxy_buffering off;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # 5. Frontend static assets & fallback
        location / {
            try_files $uri $uri/ @index;
        }

        location @index {
            rewrite ^(.*)$ /index.html break;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }
}